name: Deploy Vercel (One-off)

on:
  push:
    branches:
      - ops/deploy-main-d000932

permissions:
  contents: read

concurrency:
  group: vercel-production-manual
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify main and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm run test:core

      - name: Production build check
        run: npm run build

      - name: Validate deploy hook secret
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Missing GitHub Actions secret VERCEL_DEPLOY_HOOK"
            exit 1
          fi

      - name: Trigger Vercel production deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK")"
          echo "$RESPONSE" > vercel-deploy-response.json
          node <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("vercel-deploy-response.json", "utf8");
          const data = JSON.parse(raw);
          if (data.error) {
            console.error("Vercel rejected deployment:", data.error);
            process.exit(1);
          }
          console.log("Vercel deployment triggered successfully.");
          if (data.job?.id) console.log("Job:", data.job.id);
          if (data.job?.state) console.log("State:", data.job.state);
          NODE

      - name: Summary
        run: |
          {
            echo "## One-off Vercel production deployment"
            echo ""
            echo "- Source: current main"
            echo "- Expected main commit: d000932e0742b60ffd011aaff98deb94390eacaa"
            echo "- Typecheck + core tests + build: passed"
            echo "- Vercel deploy hook: triggered"
          } >> "$GITHUB_STEP_SUMMARY"
