name: Check Deploy Secrets (One-off)

on:
  push:
    branches:
      - ops/check-deploy-secrets-9157aa9

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret presence
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          check() {
            if [ -n "$2" ]; then
              echo "$1=present"
            else
              echo "$1=missing"
            fi
          }
          check VERCEL_TOKEN "$VERCEL_TOKEN"
          check SUPABASE_URL "$SUPABASE_URL"
          check SUPABASE_SECRET_KEY "$SUPABASE_SECRET_KEY"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
