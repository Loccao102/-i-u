name: Create active plan concurrency migration

on:
  push:
    branches:
      - feature/active-plan-lifecycle

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/active-plan-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create migration with Supabase CLI
        run: |
          if ls supabase/migrations/*_active_plan_expected_index.sql >/dev/null 2>&1; then
            exit 0
          fi

          npx --yes supabase@latest migration new active_plan_expected_index
          FILE="$(ls -t supabase/migrations/*_active_plan_expected_index.sql | head -n1)"

          cat > "$FILE" <<'SQL'
          drop function if exists public.advance_active_personal_plan(text, text);

          create or replace function public.advance_active_personal_plan(
            p_owner_key text,
            p_action text,
            p_expected_index integer
          )
          returns jsonb
          language plpgsql
          security invoker
          set search_path = ''
          as $$
          declare
            v_row public.active_personal_plans%rowtype;
            v_stop_count integer;
            v_stop_id text;
            v_next_index integer;
            v_completed text[];
            v_skipped text[];
          begin
            if p_action not in ('complete', 'skip') then
              raise exception 'invalid action';
            end if;

            if p_expected_index < 0 then
              raise exception 'invalid expected index';
            end if;

            select *
            into v_row
            from public.active_personal_plans
            where owner_key = p_owner_key
            for update;

            if not found then
              return jsonb_build_object(
                'finished', false,
                'notFound', true,
                'stale', false
              );
            end if;

            if v_row.current_stop_index <> p_expected_index then
              return jsonb_build_object(
                'finished', false,
                'notFound', false,
                'stale', true,
                'currentStopIndex', v_row.current_stop_index
              );
            end if;

            v_stop_count := jsonb_array_length(v_row.plan -> 'stops');

            if v_stop_count < 1 or v_row.current_stop_index >= v_stop_count then
              delete from public.active_personal_plans
              where owner_key = p_owner_key;

              return jsonb_build_object(
                'finished', true,
                'notFound', false,
                'stale', false
              );
            end if;

            v_stop_id := v_row.plan #>> array[
              'stops',
              v_row.current_stop_index::text,
              'placeId'
            ];

            v_completed := v_row.completed_stop_ids;
            v_skipped := v_row.skipped_stop_ids;

            if p_action = 'complete' then
              if not (v_stop_id = any(v_completed)) then
                v_completed := array_append(v_completed, v_stop_id);
              end if;
            else
              if not (v_stop_id = any(v_skipped)) then
                v_skipped := array_append(v_skipped, v_stop_id);
              end if;
            end if;

            v_next_index := v_row.current_stop_index + 1;

            if v_next_index >= v_stop_count then
              delete from public.active_personal_plans
              where owner_key = p_owner_key;

              return jsonb_build_object(
                'finished', true,
                'notFound', false,
                'stale', false,
                'action', p_action,
                'stopId', v_stop_id
              );
            end if;

            update public.active_personal_plans
            set current_stop_index = v_next_index,
                completed_stop_ids = v_completed,
                skipped_stop_ids = v_skipped,
                updated_at = now()
            where owner_key = p_owner_key;

            return jsonb_build_object(
              'finished', false,
              'notFound', false,
              'stale', false,
              'action', p_action,
              'stopId', v_stop_id
            );
          end;
          $$;

          revoke all on function public.advance_active_personal_plan(
            text, text, integer
          ) from public, anon, authenticated;

          grant execute on function public.advance_active_personal_plan(
            text, text, integer
          ) to service_role;
          SQL

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "db: make active plan progress concurrency-safe"
          git push origin HEAD:feature/active-plan-lifecycle
