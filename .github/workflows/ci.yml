name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate lockfile for diagnosis (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "LOCK_DATA_BEGIN"
          base64 -w 800 package-lock.json | sed 's/^/LOCK_DATA:/'
          echo "LOCK_DATA_END"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm run test:core
      - name: Build
        run: npm run build
